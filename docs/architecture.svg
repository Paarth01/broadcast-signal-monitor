<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title>Architecture of the IP Broadcast Signal Health Monitor</title>
  <desc>A five-stage top-down pipeline: stream simulator feeds ingestion and storage, which feeds a classification engine, which feeds a FastAPI plus SSE API, which feeds a React dashboard.</desc>

  <rect width="680" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="200" y="40" width="280" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="340" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Stream simulator</text>
    <text x="340" y="78" text-anchor="middle" font-size="11" fill="#475569">Synthetic media + PTP telemetry, injected faults</text>
  </g>

  <line x1="340" y1="96" x2="340" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="136" width="280" height="56" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1"/>
    <text x="340" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Ingestion and storage</text>
    <text x="340" y="174" text-anchor="middle" font-size="11" fill="#475569">Redis live state, PostgreSQL history</text>
  </g>

  <line x1="340" y1="192" x2="340" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="232" width="280" height="56" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1"/>
    <text x="340" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Classification engine</text>
    <text x="340" y="270" text-anchor="middle" font-size="11" fill="#475569">TR 101 290-style rules + ML anomaly fallback, PTP classifier</text>
  </g>

  <line x1="340" y1="288" x2="340" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="328" width="280" height="56" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1"/>
    <text x="340" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">FastAPI plus SSE API</text>
    <text x="340" y="366" text-anchor="middle" font-size="11" fill="#475569">Real-time event stream, REST history</text>
  </g>

  <line x1="340" y1="384" x2="340" y2="424" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="200" y="424" width="280" height="56" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
    <text x="340" y="444" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">React dashboard</text>
    <text x="340" y="462" text-anchor="middle" font-size="11" fill="#475569">Status grid, live trend chart, fault log</text>
  </g>
</svg>
