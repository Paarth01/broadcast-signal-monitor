name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train anomaly model
        run: python -m app.ml.train

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  docker-compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then
              echo "backend is up"
              exit 0
            fi
            echo "waiting for backend... ($i/30)"
            sleep 2
          done
          echo "backend never became healthy"
          exit 1

      - name: Verify streams are being simulated and classified
        run: |
          sleep 3  # let a few simulator ticks land
          curl -sf http://localhost:8000/api/streams | tee /tmp/streams.json
          # Fail if the response doesn't contain our known stream names
          grep -q "camera-1-studio-a" /tmp/streams.json
          grep -q "ptp-grandmaster" /tmp/streams.json

      - name: Verify fault injection flows through to the fault log
        run: |
          curl -sf -X POST http://localhost:8000/api/simulate/fault \
            -H "Content-Type: application/json" \
            -d '{"stream_name": "ob-van-uplink", "fault_type": "dropout", "duration_seconds": 5}'
          sleep 2
          curl -sf http://localhost:8000/api/streams/ob-van-uplink | tee /tmp/detail.json
          grep -q '"priority":1' /tmp/detail.json
          curl -sf http://localhost:8000/api/faults | grep -q "ob-van-uplink"

      - name: Verify persisted stream history endpoint
        run: |
          curl -sf "http://localhost:8000/api/streams/camera-1-studio-a/history?limit=5" | tee /tmp/history.json
          grep -q "jitter_ms" /tmp/history.json

      - name: Verify frontend is served and proxies /api through nginx
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "frontend is up"
              break
            fi
            echo "waiting for frontend... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:5173/api/streams | grep -q "camera-1-studio-a"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
